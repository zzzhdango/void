name: Build VST3

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release
      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExperimentalSpaceEcho-Windows-VST3
          path: build/ExperimentalSpaceEcho_artefacts/Release/VST3/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -G Xcode
      - name: Build Release
        run: cmake --build build --config Release
      - name: Upload VST3 & AU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExperimentalSpaceEcho-macOS-Plugins
          path: |
            build/ExperimentalSpaceEcho_artefacts/Release/VST3/
            build/ExperimentalSpaceEcho_artefacts/Release/AU/
